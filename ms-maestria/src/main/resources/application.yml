server:
  port: 8084

spring:
  application:
    name: ms-maestria
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password_local_o_nube}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # ACK del broker al publicar certificacion.aprobada / certificacion.rechazada
    publisher-confirm-type: correlated
    publisher-returns: true

homefixer:
  maestria:
    # Nivel de reputación mínimo para postular una certificación (NUEVO, BUENO, EXPERTO)
    nivel-minimo: ${MAESTRIA_NIVEL_MINIMO:BUENO}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password_local_o_nube}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        # ACK manual del consumidor; un rechazo va a la DLQ, nunca se reencola
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  # Base de la API de Auth, p. ej. https://<ref>.supabase.co/auth/v1
  auth-url: ${SUPABASE_JWT_ISSUER:}
  # Settings > API Keys > service_role (secreta: solo en el backend / .env)
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

homefixer:
  admin:
    # Correos (separados por coma) que al iniciar sesión quedan como administradores
    emails: ${ADMIN_EMAILS:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8085

spring:
  application:
    name: ms-ubicacion
  # Kafka: stream de eventos de negocio (RabbitMQ sigue a cargo del workflow transaccional)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # espera a las réplicas en sincronía (min.insync.replicas=2)
      retries: 10
      batch-size: 32768
      compression-type: lz4
      properties:
        enable.idempotence: true      # sin duplicados por reintentos del productor
        max.in.flight.requests.per.connection: 5
        linger.ms: 10                 # micro-batching
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 3000            # si Kafka no responde, no bloquear la petición HTTP más de 3 s
        spring.json.type.mapping: solicitudEvento:com.homefixer.shared.kafka.SolicitudEventoKafka,ubicacionEvento:com.homefixer.shared.kafka.UbicacionTecnicoEvento
    consumer:
      group-id: ubicacion-tracking   # tracking de técnicos desde el stream GPS
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      isolation-level: read-committed
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.homefixer.shared.kafka
        spring.json.type.mapping: solicitudEvento:com.homefixer.shared.kafka.SolicitudEventoKafka,ubicacionEvento:com.homefixer.shared.kafka.UbicacionTecnicoEvento
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 15000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password_local_o_nube}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

ubicacion:
  # Un técnico está "en línea" si reportó su posición dentro de esta ventana
  ttl-segundos: ${UBICACION_TTL_SEGUNDOS:120}
  # Radio de búsqueda por defecto para técnicos cercanos
  radio-km-defecto: ${UBICACION_RADIO_KM:30}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

homefixer:
  kafka:
    # KAFKA_ENABLED=false desactiva la publicación en Kafka sin afectar RabbitMQ
    enabled: ${KAFKA_ENABLED:true}
    simulador:
      # KAFKA_SIMULADOR=true publica posiciones GPS de 5 técnicos ficticios (flujo continuo para la demo)
      enabled: ${KAFKA_SIMULADOR:false}
      intervalo-ms: ${KAFKA_SIMULADOR_INTERVALO_MS:2000}

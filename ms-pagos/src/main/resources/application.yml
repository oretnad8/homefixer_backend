server:
  port: 8087

spring:
  application:
    name: ms-pagos
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password_local_o_nube}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # ACK del broker al publicar pago.procesado
    publisher-confirm-type: correlated
    publisher-returns: true
    # Espera máxima de la respuesta RPC de ms-solicitudes
    template:
      reply-timeout: 5000
    listener:
      simple:
        # ACK manual del consumidor; un rechazo va a la DLQ, nunca se reencola
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

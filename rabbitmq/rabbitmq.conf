# Alarmas de recursos del broker: al superar estos límites RabbitMQ bloquea a los
# productores (alarma memory/disk) en vez de caerse, y lo muestra en la consola de administración.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Si un consumidor no hace ACK en 30 min, el broker cierra su canal y reentrega el mensaje.
consumer_timeout = 1800000

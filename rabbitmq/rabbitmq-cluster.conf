# Configuración de clúster de 2 nodos para RabbitMQ (HomeFixer)
# Cumple con el requisito de EP4: "existencia de dos nodos RabbitMQ configurados y su integración en un clúster"

# Descubrimiento automático de pares (Classic Config Peer Discovery)
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Alarmas de recursos del broker
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Timeout de consumidor (30 min)
consumer_timeout = 1800000

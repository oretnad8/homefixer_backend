server:
  port: 8090

spring:
  application:
    name: ms-reportes
  # Kafka: stream de eventos de negocio (RabbitMQ sigue a cargo del workflow transaccional)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # espera a las réplicas en sincronía (min.insync.replicas=2)
      retries: 10
      batch-size: 32768
      compression-type: lz4
      properties:
        enable.idempotence: true      # sin duplicados por reintentos del productor
        max.in.flight.requests.per.connection: 5
        linger.ms: 10                 # micro-batching
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 3000            # si Kafka no responde, no bloquear la petición HTTP más de 3 s
        spring.json.type.mapping: solicitudEvento:com.homefixer.shared.kafka.SolicitudEventoKafka,ubicacionEvento:com.homefixer.shared.kafka.UbicacionTecnicoEvento
    consumer:
      group-id: reportes-metricas     # varias instancias de ms-reportes se reparten las 3 particiones
      auto-offset-reset: earliest     # un grupo nuevo reconstruye las métricas desde el log retenido
      enable-auto-commit: false       # el contenedor hace commit del offset solo tras procesar OK
      max-poll-records: 100
      isolation-level: read-committed
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.homefixer.shared.kafka
        spring.json.type.mapping: solicitudEvento:com.homefixer.shared.kafka.SolicitudEventoKafka,ubicacionEvento:com.homefixer.shared.kafka.UbicacionTecnicoEvento
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 15000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      concurrency: 3                  # 3 hilos consumidores = 3 particiones
      missing-topics-fatal: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Tiempo máximo de espera de la respuesta RPC (mensajería síncrona)
    template:
      reply-timeout: 5000
    listener:
      simple:
        # ACK manual en el consumidor de eventos
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

homefixer:
  kafka:
    # KAFKA_ENABLED=false desactiva la publicación en Kafka sin afectar RabbitMQ
    enabled: ${KAFKA_ENABLED:true}

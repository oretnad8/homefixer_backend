# Arquitectura Kafka de HomeFixer (EP5/EP6)
#   - 3 nodos Zookeeper en quórum (tolera la caída de 1; la mayoría 2/3 mantiene la coordinación)
#   - 3 brokers Kafka (RF 3 + min.insync.replicas 2: se sigue escribiendo con 1 broker caído)
#   - kafka-init: crea los tópicos del caso con sus particiones, réplicas y políticas de retención
#
# Uso:
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka-ui.yml up -d      # Kafka UI en http://localhost:8095
#   docker compose -f docker-compose.kafka.yml logs kafka-init
#
# En la nube: KAFKA_HOST=<IP o DNS público de la VM> docker compose -f docker-compose.kafka.yml up -d
# Los microservicios se conectan por los listeners EXTERNAL: <host>:9092,<host>:9093,<host>:9094

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # tópicos creados explícitamente (gobernanza)
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"   # nunca elegir líder fuera del ISR (sin pérdida de datos)
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"            # cabe en una VM de 4-8 GB

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 20s

services:
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper1
    container_name: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1-data:/var/lib/zookeeper/data
    networks: [kafka-net]
    restart: unless-stopped

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper2
    container_name: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
    networks: [kafka-net]
    restart: unless-stopped

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper3
    container_name: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
    networks: [kafka-net]
    restart: unless-stopped

  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    container_name: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks: [kafka-net]
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka2
    container_name: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks: [kafka-net]
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka3
    container_name: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks: [kafka-net]
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  # Crea los tópicos (idempotente: --if-not-exists) y termina
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    networks: [kafka-net]
    restart: "no"

networks:
  kafka-net:
    name: homefixer-kafka-net   # nombre fijo: docker-compose.kafka-ui.yml se une a esta red

volumes:
  zookeeper1-data:
  zookeeper2-data:
  zookeeper3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
